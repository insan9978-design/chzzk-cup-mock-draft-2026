<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>2026 치지직컵 팀 모의 드래프트</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <header class="topbar"><div class="brand-mark">C</div><div><span class="eyebrow">CHZZK CUP · MOCK DRAFT</span><h1>2026 치지직컵 팀 모의 드래프트</h1></div><button id="resetButton" class="quiet-button">처음부터</button></header>
  <main class="shell">
    <section id="setup" class="setup-panel">
      <div class="section-kicker">STEP 01 <span>TEAM CAPTAINS</span></div>
      <div class="setup-heading"><div><h2>미드 팀장 드래프트 순서</h2><p>팀장을 차례대로 눌러 드래프트 순서를 정하세요.</p></div><button id="startButton" class="primary-button" disabled>이 순서로 시작 <span>→</span></button></div>
      <div id="captainOrder" class="captain-order"></div>
      <div class="setup-foot"><span class="live-dot"></span> 팀장을 누른 순서대로 1번부터 배정됩니다. 배정된 칸을 누르면 취소할 수 있어요.</div>
    </section>

    <section id="draft" hidden>
      <div class="roster-heading"><div><div class="section-kicker">AVAILABLE PLAYERS</div><div class="roster-title-row"><h2>영입 가능 선수 <span>(포지션별)</span></h2><span id="turnSummary" class="turn-summary"></span></div></div><div id="filterBar" class="filter-bar"></div></div>
      <div id="playerGrid" class="player-grid"></div>
      <div class="teams-heading"><div><div class="section-kicker">TEAM ROSTERS</div><div class="teams-title-row"><h2>실시간 팀 상황</h2><button id="undoButton" class="undo-button" disabled aria-label="한 번 되돌리기">↶</button></div></div><span id="progressText" class="progress-text">0 / 24명 선택</span></div>
      <div id="teamGrid" class="team-grid"></div>
    </section>
  </main>
  <footer>CHZZK CUP MOCK DRAFT <span>·</span> 2026</footer>
  <script src="app.js?v=4"></script>
</body>
</html>
